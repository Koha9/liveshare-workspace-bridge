name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.13'
      - run: npm test
      - run: npm run check
      - name: Validate source layout and synchronized skill client
        shell: pwsh
        run: '& "${{ steps.python.outputs.python-path }}" scripts/build.py --check'
      - name: Validate Marketplace assets and reader links
        shell: pwsh
        run: '& "${{ steps.python.outputs.python-path }}" scripts/test_build.py'
      - name: Build packages
        shell: pwsh
        run: '& "${{ steps.python.outputs.python-path }}" scripts/build.py'
      - name: Verify packages
        shell: pwsh
        run: '& "${{ steps.python.outputs.python-path }}" scripts/build.py --verify'
